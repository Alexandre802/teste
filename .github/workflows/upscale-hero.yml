name: Gerar hero UHD

on:
  push:
    branches:
      - imobiliaria-demo-deploy
    paths:
      - .github/workflows/upscale-hero.yml

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: imobiliaria-demo-deploy
          fetch-depth: 0

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Diagnosticar fonte original
        run: |
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,bit_rate,codec_name,pix_fmt \
            -show_entries format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 \
            public/videos/remotion/hero-original.mp4 | tee /tmp/hero-source.txt

      - name: Gerar versão UHD mais nítida para scroll-scrub
        shell: bash
        run: |
          set -euo pipefail

          INPUT="public/videos/remotion/hero-original.mp4"
          OUTPUT="public/videos/remotion/hero-scrub-uhd.mp4"

          # O original é 720x1280. Aqui fazemos upscale Lanczos para UHD e
          # aplicamos nitidez mais forte e controlada para tornar arquitetura,
          # porta, piscina e vegetação visivelmente mais definidas. Não há blur.
          FILTER='delogo=x=545:y=16:w=100:h=58,scale=2160:3840:flags=lanczos,unsharp=7:7:1.15:5:5:0.35'

          gerar() {
            local crf="$1"
            rm -f "$OUTPUT"
            ffmpeg -y -i "$INPUT" -an \
              -vf "$FILTER" \
              -c:v libx264 \
              -preset slow \
              -tune grain \
              -crf "$crf" \
              -g 1 \
              -keyint_min 1 \
              -sc_threshold 0 \
              -bf 0 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$OUTPUT"
          }

          # Começa em CRF 14 para reduzir perda por compressão. Se passar do
          # limite seguro do GitHub, sobe só o necessário mantendo 2160x3840.
          for CRF in 14 15 16 18; do
            gerar "$CRF"
            BYTES=$(stat -c%s "$OUTPUT")
            echo "CRF=$CRF tamanho=$BYTES bytes"
            if [ "$BYTES" -lt 95000000 ]; then
              echo "$CRF" > /tmp/hero-crf.txt
              break
            fi
          done

          BYTES=$(stat -c%s "$OUTPUT")
          if [ "$BYTES" -ge 95000000 ]; then
            echo "O arquivo UHD continuou acima do limite seguro do GitHub." >&2
            exit 1
          fi

      - name: Gerar posters UHD
        run: |
          ffmpeg -y -i public/videos/remotion/hero-scrub-uhd.mp4 \
            -vf "select=eq(n\,0)" \
            -frames:v 1 \
            -c:v libwebp \
            -quality 100 \
            -compression_level 6 \
            public/imagens/hero/hero-inicio-uhd.webp

          ffmpeg -y -i public/videos/remotion/hero-scrub-uhd.mp4 \
            -vf "select=eq(n\,191)" \
            -vsync 0 \
            -frames:v 1 \
            -c:v libwebp \
            -quality 100 \
            -compression_level 6 \
            public/imagens/hero/hero-final-uhd.webp

      - name: Gerar relatório técnico
        shell: bash
        run: |
          CRF=$(cat /tmp/hero-crf.txt)
          {
            echo "# HERO UHD REPORT"
            echo
            echo "## Fonte"
            echo '```'
            cat /tmp/hero-source.txt
            echo '```'
            echo
            echo "## Saída usada no site"
            echo "- Arquivo: public/videos/remotion/hero-scrub-uhd.mp4"
            echo "- Resolução: 2160x3840"
            echo "- FPS: 24"
            echo "- Quadros: 192"
            echo "- Codec: H.264 / yuv420p"
            echo "- CRF aplicado: ${CRF}"
            echo "- GOP: 1 (todo quadro é keyframe para scroll-scrub)"
            echo "- Filtro: Lanczos 3x + unsharp 7x7 forte/controlado + remoção do selo"
            echo "- Tune: grain, para preservar microtextura e evitar aparência plastificada"
            echo "- Observação: a fonte original é 720x1280. Esta versão prioriza nitidez percebida e baixa perda de compressão, mas não consegue inventar detalhe óptico que não exista no original."
            echo
            echo "## Tamanho"
            stat -c '%n: %s bytes' public/videos/remotion/hero-scrub-uhd.mp4
            stat -c '%n: %s bytes' public/imagens/hero/hero-inicio-uhd.webp
            stat -c '%n: %s bytes' public/imagens/hero/hero-final-uhd.webp
          } > HERO-UHD-REPORT.md

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,bit_rate,codec_name,pix_fmt \
            -show_entries format=duration,size,bit_rate \
            -of default=noprint_wrappers=1 \
            public/videos/remotion/hero-scrub-uhd.mp4 >> HERO-UHD-REPORT.md

      - name: Commitar assets UHD
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/remotion/hero-scrub-uhd.mp4 \
                  public/imagens/hero/hero-inicio-uhd.webp \
                  public/imagens/hero/hero-final-uhd.webp \
                  HERO-UHD-REPORT.md
          git commit -m "Reprocessa hero UHD com nitidez reforçada"
          git push origin HEAD:imobiliaria-demo-deploy
