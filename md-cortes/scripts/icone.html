<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#07080b;overflow:hidden}
  .placa{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 90% at 50% 0%, #1c1710 0%, transparent 62%),
      linear-gradient(165deg,#101115 0%,#07080b 100%);
  }
  .miolo{display:flex;flex-direction:column;align-items:center;gap:14px}
  .marca{
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    font-weight:800;font-size:150px;line-height:.86;letter-spacing:-.055em;
    background:linear-gradient(180deg,#f7dfa6 0%,#e0ac47 46%,#a97b28 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .regua{width:186px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,transparent,#d9a441 22%,#f0cd80 50%,#d9a441 78%,transparent)}
  body.badge .placa{background:transparent}
  body.badge .marca,body.badge .regua{display:none}
</style></head>
<body>
  <div class="placa">
    <div class="miolo" id="miolo">
      <svg width="150" height="150" viewBox="0 0 64 64" fill="none" id="tesoura">
        <defs><linearGradient id="o" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7dfa6"/><stop offset=".5" stop-color="#e0ac47"/>
          <stop offset="1" stop-color="#a97b28"/></linearGradient></defs>
        <g stroke="url(#o)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" id="tracos">
          <path d="M17 10 L41 45"/>
          <path d="M47 10 L23 45"/>
          <circle cx="17.5" cy="51.5" r="6.6"/>
          <circle cx="46.5" cy="51.5" r="6.6"/>
        </g>
        <circle cx="32" cy="31" r="2.6" fill="url(#o)" id="pino"/>
      </svg>
      <div class="marca">MD</div>
      <div class="regua"></div>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const lado = Number(p.get('lado') || 512);
  const escala = Number(p.get('escala') || 1);
  document.getElementById('miolo').style.transform = 'scale(' + (lado/512) * escala + ')';
  if (p.get('badge')) {
    document.body.classList.add('badge');
    // Badge do Android é recortado como silhueta: só branco sólido sobrevive.
    document.getElementById('tracos').setAttribute('stroke', '#ffffff');
    document.getElementById('pino').setAttribute('fill', '#ffffff');
  }
</script>
</body></html>
